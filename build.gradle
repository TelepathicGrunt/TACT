plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.0.0-beta.2'
    id 'net.neoforged.moddev.legacyforge' version '2.0.88'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.mod_group_id

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

repositories {
    maven {
        url = 'https://maven.fabricmc.net'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    compileOnly("org.spongepowered:mixin:${project.mixin_version}")
    annotationProcessor('net.fabricmc:sponge-mixin:0.13.0+mixin.0.8.5')
    annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}")
    compileOnly("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}")
    implementation("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}")
    jarJar("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}")

    modImplementation(modRuntimeOnly("curse.maven:alexs-caves-924854:5848216"))
    modImplementation(modRuntimeOnly("curse.maven:citadel-331936:6702068"))
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', project.layout.buildDirectory.get().file('createSrgToMcp/output.srg').asFile.absolutePath
        }

        server {
            server()
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', project.layout.buildDirectory.get().file('createSrgToMcp/output.srg').asFile.absolutePath
        }
    }
    mods {
        modServerRun {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
}

processResources {
    filteringCharset "UTF-8"

    def expandProps = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]

    filesMatching(['pack.mcmeta', '*.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

def javaVersion = 17
java {
    if (JavaVersion.current() < JavaVersion.toVersion(javaVersion)) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    } else {
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    withSourcesJar()
//        withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(javaVersion)
}

javadoc {
    // make javadoc not throw on mixin's '@reason'
    options.tags = ["reason"]
}

jar {
    def licenseFile = project.file("LICENSE.txt")
    inputs.file(licenseFile)

    from(licenseFile) {
        rename { "LICENSE_${project.mod_id}.txt" }
    }

    manifest {
        attributes([
            "MixinConfigs": "${project.mod_id}.mixins.json"
        ])
    }
}

sourcesJar {
    def licenseFile = project.file("LICENSE.txt")
    inputs.file(licenseFile)

    from(licenseFile) {
        rename { "LICENSE_${project.mod_id}.txt" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId "${project.mod_id}"
            from components.java

            pom {
                name = 'TACT'
                description = 'Tiny Alex\'s Caves Tweaks'
                url = 'https://github.com/TelepathicGrunt/TACT'

                scm {
                    connection = 'git:https://github.com/TelepathicGrunt/TACT.git'
                    developerConnection = 'git:https://github.com/TelepathicGrunt/TACT.git'
                    url = 'https://github.com/TelepathicGrunt/TACT'
                }

                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://github.com/TelepathicGrunt/TACT/LICENSE'
                    }
                }

                developers {
                    developer {
                        id = 'telepathic_grunt'
                        name = 'TelepathicGrunt'
                        email = 'asarnesespam@gmail.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url = uri("https://nexus.resourcefulbees.com/repository/telepathicgrunt/")
            credentials {
                username "$System.env.MAVEN_USER"
                password "$System.env.MAVEN_PASS"
            }
        }
    }
}

publishMods {
    file = tasks.reobfJar.archiveFile
    type = STABLE

    displayName = "TACT v${project.mod_version} (${project.minecraft_version} MC)"
    version = "${project.mod_version}+${project.minecraft_version}"

    if (project.hasProperty('curseforge_id')) {
        curseforge('CurseforgeForge') {
            accessToken = providers.environmentVariable('CURSEFORGEKEY')
            projectId = project.findProperty('curseforge_id')

            minecraftVersions.add(project.minecraft_version)
            modLoaders.add("forge")
            client = true
            server = true

            File changeLog = project.file("CHANGELOG.md")
            changelog =  changeLog.exists() ? changeLog.text : ""

            requires("alexs-caves")
        }
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

task checkForRefmap() {
    if (file("./build/libs/tact-${project.mod_version}+${project.minecraft_version}.jar").exists()) {
        assert zipTree("./build/libs/tact-${project.mod_version}+${project.minecraft_version}.jar")
                .matching { include "tact.refmap.json" }.getSingleFile() != null
    }
}

tasks.register('buildAndRelease') {
    dependsOn(tasks.build, tasks.checkForRefmap, tasks.publish, tasks.publishMods)
}
tasks.checkForRefmap.mustRunAfter tasks.build
tasks.publish.mustRunAfter tasks.checkForRefmap
tasks.publishMods.mustRunAfter tasks.publish